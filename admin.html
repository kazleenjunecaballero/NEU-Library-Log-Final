<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); 
            background-size: cover; background-position: center;
            background-attachment: fixed; /* Crucial for preventing stretch */
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start; /* top align */
            height: 100vh; overflow: hidden; /* Prevent full body scroll */
        }

        .dashboard-container {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 20px;
            width: 95%; max-width: 1400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            /* Zoom scaling fix from before */
            transform: scale(0.9); transform-origin: top center;
            display: flex; flex-direction: column;
            height: 85vh; /* Set a fixed height for the whole container */
        }

        .admin-header, .stats-grid, .filter-bar {
            /* Keep these non-scrollable */
            flex-shrink: 0; 
        }

        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #ddd; }
        .stat-card p { font-size: 28px; font-weight: bold; margin: 5px 0 0 0; color: #cc0000; }
        
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 12px; border-radius: 10px; align-items: center; flex-wrap: wrap; }
        .logout-btn { background: #cc0000; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }

        /* THE SCROLLABLE TABLE AREA */
        .table-scroll-container {
            flex-grow: 1; /* Take up all remaining space */
            overflow-y: auto; /* Enable vertical scroll when content overflows */
            border-radius: 8px;
            border: 1px solid #eee;
            background: white;
            /* Thin scrollbar for modern browsers */
            scrollbar-width: thin; 
            scrollbar-color: #ddd #f4f4f4;
        }

        table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }

        /* Fixed table header so it stays while scrolling */
        thead {
            position: sticky; top: 0; z-index: 1;
        }
        th { background-color: #cc0000; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #333; }
        .status-badge { background: #333; color: white; padding: 3px 6px; border-radius: 4px; font-size: 10px; }
        .block-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="admin-header">
            <h1 style="color: #cc0000; margin: 0;">Library Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>Today's Visits</h3><p id="todayCount">0</p></div>
            <div class="stat-card"><h3>Total Logs</h3><p id="monthCount">0</p></div>
        </div>

        <div class="filter-bar">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button onclick="loadVisitors()" style="background: #333; color: white; border: none; padding: 8px 12px; border-radius: 5px;">Filter</button>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search..." style="flex-grow: 1;">
            <button onclick="downloadPDF()" style="background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px;">Export PDF</button>
        </div>

        <div class="table-scroll-container">
            <table id="visitorTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                        <th>College/Dept</th>
                        <th>Purpose</th>
                        <th>Date & Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="visitorTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        async function loadVisitors() {
            try {
                const response = await fetch('/api/visitors');
                const data = await response.json();
                
                const today = new Date().toDateString();
                document.getElementById('todayCount').innerText = data.filter(v => new Date(v.time).toDateString() === today).length;
                document.getElementById('monthCount').innerText = data.length;

                const tableBody = document.getElementById('visitorTableBody');
                tableBody.innerHTML = ''; 
                
                data.forEach(v => {
                    const row = `<tr>
                        <td><strong>${v.firstName} ${v.lastName}</strong><br><small>${v.email}</small></td>
                        <td><span class="status-badge">${v.role || 'Visitor'}</span></td>
                        <td>${v.college || 'N/A'}</td>
                        <td>${v.reason}</td>
                        <td>${new Date(v.time).toLocaleString()}</td>
                        <td><button class="block-btn" onclick="toggleBlock('${v._id}', ${!v.isBlocked})">${v.isBlocked ? 'Unblock' : 'Block'}</button></td>
                    </tr>`;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });
            } catch (err) { alert("Failed to fetch logs."); }
        }

        // Filtering logic, fixed to handle the scroll container correctly
        function filterTable() {
            const val = document.getElementById("searchInput").value.toUpperCase();
            const trs = document.querySelectorAll("#visitorTableBody tr");
            trs.forEach(tr => {
                const visible = tr.innerText.toUpperCase().includes(val);
                tr.style.display = visible ? "" : "none";
            });
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            doc.text("NEU Library Visitor Report", 14, 15);
            doc.autoTable({ html: '#visitorTable', columns: [0, 1, 2, 3, 4] });
            doc.save("NEU_Library_Log.pdf");
        }

        loadVisitors();
    </script>
</body>
</html>
