<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container" style="background: white; padding: 20px; border-radius: 10px; width: 80%;">
        <h1>Visitor Log Records</h1>
        <table border="1" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>College</th>
                    <th>Purpose</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="visitorTableBody">
                </tbody>
        </table>
    </div>
</body>
</html>
