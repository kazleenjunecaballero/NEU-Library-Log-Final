<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; margin: 0; }
        .dashboard { background: white; padding: 30px; border-radius: 12px; max-width: 1100px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cc0000; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #333; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #cc0000; color: white; padding: 12px; text-align: left; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #444; }
        .badge { background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .logout-btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #000; }
        .del-btn { color: #ff0000; cursor: pointer; border: 1px solid #ff0000; background: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .del-btn:hover { background: #ff0000; color: white; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>NEU Library Logs</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name & Email</th>
                    <th>Role</th>
                    <th>College / Year / Dept</th>
                    <th>Program</th>
                    <th>Date/Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="visitorBody">
                </tbody>
        </table>
    </div>

    <script>
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadVisitors() {
            try {
                const res = await fetch('/api/visitors');
                if (!res.ok) throw new Error('Failed to fetch data');
                
                const data = await res.json();
                const tbody = document.getElementById('visitorBody');
                tbody.innerHTML = '';

                data.forEach(v => {
                    const firstName = v.firstName || '';
                    const lastName = v.lastName || '';
                    const fullName = `${firstName} ${lastName}`.trim() || 'Unknown User';
                    
                    // Logic to display Student Year or Faculty Department
                    let infoDisplay = 'N/A';
                    if (v.role === 'Student') {
                        infoDisplay = `${v.college || ''} (${v.yearLevel || 'N/A'})`;
                    } else if (v.role === 'Faculty') {
                        infoDisplay = v.department || 'Faculty Dept';
                    }

                    const row = `
                        <tr>
                            <td><strong>${fullName}</strong><br><small style="color:#888">${v.email || ''}</small></td>
                            <td><span class="badge">${v.role || 'Visitor'}</span></td>
                            <td>${infoDisplay}</td>
                            <td>${v.program || 'N/A'}</td>
                            <td>${new Date(v.time).toLocaleString()}</td>
                            <td><button class="del-btn" onclick="deleteEntry('${v._id}')">Delete</button></td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        async function deleteEntry(id) {
            if(confirm("Are you sure you want to delete this log entry?")) {
                try {
                    const res = await fetch(`/api/visitors/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadVisitors(); // Refresh the list
                    } else {
                        alert('Delete failed');
                    }
                } catch (err) {
                    alert('Server error during delete');
                }
            }
        }

        // Run on page load
        loadVisitors();
    </script>
</body>
</html>
