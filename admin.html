<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - NEU Library</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard-container { 
            background: white; padding: 20px; border-radius: 15px; width: 95%; max-width: 1300px;
            transform: scale(0.9); transform-origin: top center; /* Fixes the zoom out issue */
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #cc0000; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .logout-btn { background: #cc0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <button class="logout-btn" onclick="location.href='index.html'">Logout</button>
        <h1 style="color: #cc0000;">Library Admin Dashboard</h1>
        <table>
            <thead><tr><th>Name</th><th>Role</th><th>College</th><th>Reason</th><th>Time</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        async function load() {
            const res = await fetch('/api/visitors');
            const data = await res.json();
            document.getElementById('tableBody').innerHTML = data.map(v => `
                <tr>
                    <td>${v.firstName} ${v.lastName}</td>
                    <td>${v.role}</td>
                    <td>${v.college}</td>
                    <td>${v.reason}</td>
                    <td>${new Date(v.time).toLocaleString()}</td>
                </tr>`).join('');
        }
        load();
    </script>
</body>
</html>
