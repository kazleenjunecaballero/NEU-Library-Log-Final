<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px; 
            margin: 0; 
            height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .dashboard { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 30px; 
            border-radius: 12px; 
            width: 95%;
            max-width: 1300px; 
            height: 85vh; 
            display: flex;
            flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            overflow: hidden;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid #cc0000; 
            padding-bottom: 15px; 
            margin-bottom: 15px;
            flex-shrink: 0; 
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-logo {
            width: 50px;
            height: auto;
        }

        /* UNIVERSAL SEARCH STYLE */
        .search-container {
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #cc0000;
            box-shadow: 0 0 8px rgba(204, 0, 0, 0.1);
        }

        .table-container { 
            width: 100%; 
            overflow-y: auto; 
            overflow-x: auto; 
            flex-grow: 1; 
            border: 1px solid #eee;
            border-radius: 8px;
            position: relative;
            background: white;
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            min-width: 1100px; 
        }
        
        th { 
            background: #cc0000; 
            color: white; 
            padding: 15px 12px; 
            text-align: left; 
            position: sticky; 
            top: 0; 
            z-index: 10;
            box-shadow: 0 2px 2px rgba(0,0,0,0.1);
        }

        td { 
            padding: 12px; 
            border-bottom: 1px solid #eee; 
            font-size: 14px; 
            color: #444; 
        }

        .badge {
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .logout-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover { background: #000; }

        .del-btn {
            color: #cc0000;
            cursor: pointer;
            border: 1px solid #cc0000;
            background: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }

        .del-btn:hover { background: #cc0000; color: white; }

        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #cc0000; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <div class="header-left">
                <img src="New_Era_University.svg.png" alt="NEU Logo" class="admin-logo">
                <h1 style="margin:0; font-size: 24px;">NEU Library Logs</h1>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="universalSearch" 
                       placeholder="Search by Name, Role, College, Program, Purpose..." 
                       onkeyup="filterTable()">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name & Email</th>
                        <th>Role</th>
                        <th>College / Year / Dept</th>
                        <th>Program</th>
                        <th>Purpose</th>
                        <th>Date/Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="visitorBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // UNIVERSAL FILTER LOGIC
        function filterTable() {
            const query = document.getElementById('universalSearch').value.toLowerCase();
            const rows = document.querySelectorAll('#visitorBody tr');

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? "" : "none";
            });
        }

        async function loadVisitors() {
            try {
                const res = await fetch('/api/visitors');
                if (!res.ok) throw new Error('Failed to fetch data');
                
                const data = await res.json();
                const tbody = document.getElementById('visitorBody');
                tbody.innerHTML = '';

                data.forEach(v => {
                    const firstName = v.firstName || '';
                    const lastName = v.lastName || '';
                    const fullName = `${firstName} ${lastName}`.trim() || 'Unknown User';
                    
                    let infoDisplay = 'N/A';
                    if (v.role === 'Student') {
                        infoDisplay = `${v.college || ''} (${v.yearLevel || 'N/A'})`;
                    } else if (v.role === 'Faculty') {
                        infoDisplay = v.department || 'Faculty Dept';
                    }

                    const row = `
                        <tr>
                            <td>
                                <strong>${fullName}</strong><br>
                                <small style="color:#666">${v.email || ''}</small>
                            </td>
                            <td><span class="badge">${v.role || 'Visitor'}</span></td>
                            <td>${infoDisplay}</td>
                            <td>${v.program || 'N/A'}</td>
                            <td style="font-weight: 600; color: #cc0000;">${v.reason || 'N/A'}</td>
                            <td>${v.time ? new Date(v.time).toLocaleString() : 'N/A'}</td>
                            <td>
                                <button class="del-btn" onclick="deleteEntry('${v._id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Could not load logs. Check server connection.");
            }
        }

        async function deleteEntry(id) {
            if(confirm("Are you sure you want to delete this log entry?")) {
                try {
                    const res = await fetch(`/api/visitors/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadVisitors();
                    } else {
                        alert('Delete failed');
                    }
                } catch (err) {
                    alert('Server error during delete');
                }
            }
        }

        loadVisitors();
    </script>
</body>
</html>
