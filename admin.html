<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
   <style>
    body { 
        font-family: 'Segoe UI', sans-serif; 
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        padding: 20px; 
        margin: 0; 
        height: 100vh; /* Keeps the background full screen */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* Prevents the whole website from scrolling */
    }

    .dashboard { 
        background: rgba(255, 255, 255, 0.98); 
        padding: 30px; 
        border-radius: 12px; 
        width: 95%;
        max-width: 1250px; 
        height: 85vh; /* Limits dashboard height */
        display: flex;
        flex-direction: column; /* Stacks header and table vertically */
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }

    .header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 3px solid #cc0000; 
        padding-bottom: 15px; 
        margin-bottom: 20px;
        flex-shrink: 0; /* Prevents header from squishing */
    }

    /* THE SCROLLING PART */
    .table-container { 
        width: 100%; 
        overflow-y: auto; /* Adds the vertical scroll on the side */
        overflow-x: auto; /* Adds horizontal scroll if columns are too wide */
        flex-grow: 1; /* Allows the table to take up remaining space */
        border: 1px solid #eee;
        border-radius: 8px;
    }

    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    
    /* Sticky Header so you see column names while scrolling */
    th { 
        background: #cc0000; 
        color: white; 
        padding: 12px; 
        text-align: left; 
        position: sticky; 
        top: 0; 
        z-index: 10;
    }

    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #444; }
    
    /* Customize the scrollbar for a cleaner look */
    .table-container::-webkit-scrollbar { width: 8px; }
    .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
    .table-container::-webkit-scrollbar-thumb { background: #cc0000; border-radius: 4px; }
</style>

<body>
    <div class="dashboard">
        <div class="header">
            <h1>NEU Library Logs</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name & Email</th>
                        <th>Role</th>
                        <th>College / Year / Dept</th>
                        <th>Program</th>
                        <th>Purpose</th>
                        <th>Date/Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="visitorBody">
                    </tbody>
            </table>
        </div>
    </div>
</body>

        <table>
            <thead>
                <tr>
                    <th>Name & Email</th>
                    <th>Role</th>
                    <th>College / Year / Dept</th>
                    <th>Program</th>
                    <th>Purpose</th> 
                    <th>Date/Time</th> 
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="visitorBody">
                </tbody>
        </table>
    </div>

    <script>
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

      async function loadVisitors() {
    try {
        const res = await fetch('/api/visitors');
        if (!res.ok) throw new Error('Failed to fetch data');
        
        const data = await res.json();
        const tbody = document.getElementById('visitorBody');
        tbody.innerHTML = '';

        data.forEach(v => {
            const firstName = v.firstName || '';
            const lastName = v.lastName || '';
            const fullName = `${firstName} ${lastName}`.trim() || 'Unknown User';
            
            // 1. Keep your Logic to display Student Year or Faculty Department
            let infoDisplay = 'N/A';
            if (v.role === 'Student') {
                infoDisplay = `${v.college || ''} (${v.yearLevel || 'N/A'})`;
            } else if (v.role === 'Faculty') {
                infoDisplay = v.department || 'Faculty Dept';
            }

            // 2. Create the row with 7 columns (matching the 7 headers)
            const row = `
                <tr>
                    <td>
                        <strong>${fullName}</strong><br>
                        <small style="color:#666">${v.email || ''}</small>
                    </td>
                    <td><span class="badge">${v.role || 'Visitor'}</span></td>
                    <td>${infoDisplay}</td>
                    <td>${v.program || 'N/A'}</td>
                    <td style="font-weight: 500; color: #cc0000;">${v.reason || 'N/A'}</td>
                    <td>${v.time ? new Date(v.time).toLocaleString() : 'N/A'}</td>
                    <td>
                        <button class="del-btn" onclick="deleteEntry('${v._id}')">Delete</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    } catch (err) {
        console.error("Login Error:", err);
        alert("Could not load logs. Check if server is running.");
    }
}

        async function deleteEntry(id) {
            if(confirm("Are you sure you want to delete this log entry?")) {
                try {
                    const res = await fetch(`/api/visitors/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadVisitors(); // Refresh the list
                    } else {
                        alert('Delete failed');
                    }
                } catch (err) {
                    alert('Server error during delete');
                }
            }
        }

        // Run on page load
        loadVisitors();
    </script>
</body>
</html>
