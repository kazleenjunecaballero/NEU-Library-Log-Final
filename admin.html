<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #cc0000; }
        .stat-card h3 { margin: 0; color: #666; font-size: 14px; }
        .stat-card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; color: #cc0000; }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; background: #f4f4f4; padding: 15px; border-radius: 8px; align-items: center; }
        .block-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body style="padding: 40px;">
    <div class="admin-container">
        <h1>NEU Library Admin Dashboard</h1>

        <div class="stats-grid">
            <div class="stat-card"><h3>Today</h3><p id="todayCount">0</p></div>
            <div class="stat-card"><h3>This Week</h3><p id="weekCount">0</p></div>
            <div class="stat-card"><h3>This Month</h3><p id="monthCount">0</p></div>
        </div>

        <div class="filter-bar">
            <label>From:</label><input type="date" id="startDate">
            <label>To:</label><input type="date" id="endDate">
            <button onclick="loadVisitors()" style="background: #333; color: white;">Apply Filter</button>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search names, program, reason..." style="flex-grow: 1;">
            <button onclick="downloadPDF()" style="background: #28a745; color: white;">Export PDF</button>
        </div>

        <table id="visitorTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>College/Dept</th>
                    <th>Purpose</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="visitorTableBody"></tbody>
        </table>
    </div>

    <script>
        async function loadVisitors() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            let url = '/api/visitors';
            if(start && end) url += `?start=${start}&end=${end}`;

            const response = await fetch(url);
            const data = await response.json();
            
            // Calculate Stats
            document.getElementById('todayCount').innerText = data.filter(v => new Date(v.time).toDateString() === new Date().toDateString()).length;
            document.getElementById('monthCount').innerText = data.length;

            const tableBody = document.getElementById('visitorTableBody');
            tableBody.innerHTML = ''; 
            
            data.forEach(v => {
                const row = `<tr>
                    <td>${v.firstName} ${v.lastName}</td>
                    <td><span class="status-badge">${v.role}</span></td>
                    <td>${v.college || v.department}</td>
                    <td>${v.reason}</td>
                    <td>${new Date(v.time).toLocaleString()}</td>
                    <td><button class="block-btn" onclick="toggleBlock('${v._id}', ${!v.isBlocked})">${v.isBlocked ? 'Unblock' : 'Block'}</button></td>
                </tr>`;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        async function toggleBlock(id, status) {
            await fetch(`/api/visitors/${id}/block`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isBlocked: status })
            });
            loadVisitors();
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("NEU Library Visitor Report", 14, 15);
            doc.autoTable({ html: '#visitorTable' });
            doc.save("NEU_Report.pdf");
        }

        loadVisitors();
    </script>
</body>
</html>
