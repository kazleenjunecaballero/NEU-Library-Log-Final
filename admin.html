<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NEU Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #cc0000; }
        .stat-card h3 { margin: 0; color: #666; font-size: 14px; }
        .stat-card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; color: #cc0000; }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; background: white; padding: 20px; border-radius: 10px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #cc0000; color: white; text-transform: uppercase; font-size: 12px; }
        .status-badge { background: #e9ecef; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .block-btn { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .block-btn:hover { background: #a71d2a; }
        .logout-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1 style="color: #cc0000; margin: 0;">NEU Library Records</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Today</h3><p id="todayCount">0</p></div>
        <div class="stat-card"><h3>This Week</h3><p id="weekCount">0</p></div>
        <div class="stat-card"><h3>This Month</h3><p id="monthCount">0</p></div>
    </div>

    <div class="filter-bar">
        <label>From:</label><input type="date" id="startDate">
        <label>To:</label><input type="date" id="endDate">
        <button onclick="loadVisitors()" style="background: #cc0000; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Apply Date Filter</button>
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search names, program, reason..." style="flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
        <button onclick="downloadPDF()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Export PDF</button>
    </div>

    <table id="visitorTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>College/Dept</th>
                <th>Purpose</th>
                <th>Date & Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="visitorTableBody"></tbody>
    </table>

    <script>
        // LOGOUT LOGIC
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // SEARCH FILTER LOGIC [Requirement 3]
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const tr = document.getElementById("visitorTableBody").getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                const textContent = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = textContent.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        async function loadVisitors() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            let url = '/api/visitors';
            if(start && end) url += `?start=${start}&end=${end}`;

            const response = await fetch(url);
            const data = await response.json();
            
            // Stats Calculations
            document.getElementById('todayCount').innerText = data.filter(v => new Date(v.time).toDateString() === new Date().toDateString()).length;
            document.getElementById('monthCount').innerText = data.length;

            const tableBody = document.getElementById('visitorTableBody');
            tableBody.innerHTML = ''; 
            
            data.forEach(v => {
                const row = `<tr>
                    <td><strong>${v.firstName} ${v.lastName}</strong></td>
                    <td><span class="status-badge">${v.role}</span></td>
                    <td>${v.college || v.department}</td>
                    <td>${v.reason}</td>
                    <td>${new Date(v.time).toLocaleString()}</td>
                    <td><button class="block-btn" onclick="toggleBlock('${v._id}', ${!v.isBlocked})">${v.isBlocked ? 'Unblock' : 'Block'}</button></td>
                </tr>`;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        async function toggleBlock(id, status) {
            await fetch(`/api/visitors/${id}/block`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isBlocked: status })
            });
            loadVisitors();
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("NEU Library Visitor Report", 14, 15);
            doc.autoTable({ 
                html: '#visitorTable',
                columns: [0, 1, 2, 3, 4] // Don't include the 'Action' column in PDF
            });
            doc.save("NEU_Library_Log.pdf");
        }

        loadVisitors();
    </script>
</body>
</html>
