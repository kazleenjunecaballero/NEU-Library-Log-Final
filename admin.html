<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Library Statistics</h1>
    <div class="dashboard-cards">
        <div class="card">
            <h3>Today's Visitors</h3>
            <p id="dailyCount">0</p>
        </div>
        <div class="card">

        <div class="card">
            <h3>Monthly Total</h3>
            <p id="monthlyCount">0</p>
        </div>
    </div>
</body>
</html>
