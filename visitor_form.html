<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Your Visit - NEU Library</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
            background-size: cover; 
            background-position: center; 
            height: 100vh; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top Logout Button for manual exit before logging visit */
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #cc0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 2000;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background-color: #333;
        }

        .form-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .neu-logo {
            width: 100px;
            margin-bottom: 20px;
        }

        h2 { color: #333; margin-bottom: 20px; font-size: 22px; }

        select { 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            border: 2px solid #eee; 
            font-size: 16px; 
            margin-bottom: 20px; 
            background-color: #f9f9f9;
            outline: none;
        }

        select:focus {
            border-color: #cc0000;
        }

        .log-btn { 
            width: 100%; 
            background-color: #cc0000; 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px;
            transition: 0.3s;
        }

        .log-btn:hover {
            background-color: #a30000;
            transform: translateY(-2px);
        }

        .success-message h1 {
            color: #cc0000;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <button class="logout-btn" onclick="handleLogout()">Logout</button>
    
    <div class="form-card" id="mainCard">
        <div id="purposeStep">
            <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo">
            <h2>What is your purpose?</h2>
            <select id="reason">
                <option value="Study">Study / Research</option>
                <option value="Borrow">Borrow / Return Books</option>
                <option value="Clearance">Clearance / Documents</option>
                <option value="Meeting">Group Meeting</option>
            </select>
            <button class="log-btn" id="submitBtn" onclick="submitVisit()">Log My Visit</button>
        </div>

        <div id="successStep" class="hidden">
            <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo">
            <div class="success-message">
                <h1>Success!</h1>
                <p style="color: #666; margin-top: 10px;">Logging you out...</p>
            </div>
        </div>
    </div>

    <script>
        // Clears session and returns to login page
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function submitVisit() {
            const email = localStorage.getItem("userEmail");
            const reason = document.getElementById('reason').value;
            const submitBtn = document.getElementById('submitBtn');

            // Basic check to ensure user is logged in
            if (!email) {
                window.location.href = "index.html";
                return;
            }

            // Disable button to prevent double-clicking
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            try {
                const res = await fetch('/api/visitors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, reason })
                });

                if (res.ok) {
                    // Show success UI
                    document.getElementById('purposeStep').classList.add('hidden');
                    document.getElementById('successStep').classList.remove('hidden');
                    
                    // Immediately trigger logout and redirect
                    // This happens without a timer for maximum efficiency
                    handleLogout();

                } else {
                    alert("Error saving log. Please try again.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Log My Visit";
                }
            } catch (err) {
                alert("Connection error. Check your server.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Log My Visit";
            }
        }
    </script>
</body>
</html>
