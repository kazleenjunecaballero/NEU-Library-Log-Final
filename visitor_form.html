<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Your Visit - NEU Library</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
            background-size: cover; background-position: center; height: 100vh; margin: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .form-card { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; }
        select { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; margin-bottom: 20px; }
        .log-btn { width: 100%; background-color: #cc0000; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>What is your purpose?</h2>
        <select id="reason">
            <option value="Study">Study / Research</option>
            <option value="Borrow">Borrow / Return Books</option>
            <option value="Clearance">Clearance / Documents</option>
            <option value="Meeting">Group Meeting</option>
        </select>
        <button class="log-btn" onclick="submitVisit()">Log My Visit</button>
    </div>

    <script>
        async function submitVisit() {
            const email = localStorage.getItem("userEmail");
            const reason = document.getElementById('reason').value;

            const res = await fetch('/api/visitors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, reason })
            });

            if (res.ok) {
                // Centered Welcome Message and Redirect
                document.body.innerHTML = `
                    <div style="height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; background: white;">
                        <h1 style="color: #cc0000; font-family: 'Segoe UI', sans-serif; font-size: 50px;">
                            Welcome to NEU Library!
                        </h1>
                    </div>
                `;
                setTimeout(() => { window.location.href = "index.html"; }, 3000);
            }
        }
    </script>
</body>
</html>
