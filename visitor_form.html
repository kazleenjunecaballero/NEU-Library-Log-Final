<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Your Visit - NEU Library</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
            background-size: cover; 
            background-position: center; 
            height: 100vh; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .logout-btn {
            position: absolute; top: 20px; right: 20px;
            background-color: #cc0000; color: white;
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; z-index: 2000;
        }

        .form-card { 
            background: rgba(255, 255, 255, 0.95); padding: 40px; 
            border-radius: 20px; width: 90%; max-width: 450px; 
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .neu-logo { width: 100px; margin-bottom: 20px; }
        #welcomeMsg { color: #cc0000; font-weight: bold; margin-bottom: 10px; font-size: 18px; }
        select { width: 100%; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .log-btn { 
            width: 100%; background-color: #cc0000; color: white; 
            padding: 15px; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; font-size: 18px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <button class="logout-btn" onclick="handleLogout()">Logout</button>
    
    <div class="form-card" id="mainCard">
        <div id="purposeStep">
            <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo">
            <div id="welcomeMsg">Loading session...</div>
            <h2>What is your purpose?</h2>
            <select id="reason">
                <option value="Study">Study / Research</option>
                <option value="Borrow">Borrow / Return Books</option>
                <option value="Clearance">Clearance / Documents</option>
                <option value="Meeting">Group Meeting</option>
            </select>
            <button class="log-btn" id="submitBtn" onclick="submitVisit()">Log My Visit</button>
        </div>

        <div id="successStep" class="hidden">
            <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo">
            <div class="success-message">
                <h1 style="color: #cc0000;">Welcome to NEU Library!</h1>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const name = localStorage.getItem("userName");
            const program = localStorage.getItem("userProgram");
            const email = localStorage.getItem("userEmail");

            if (!email || !name) {
                window.location.href = "index.html";
                return;
            }
            document.getElementById('welcomeMsg').innerText = 
             `Welcome, ${name}${program ? ' from ' + program : ''}! Welcome to NEU Library!`;
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function submitVisit() {
            const email = localStorage.getItem("userEmail");
            const reason = document.getElementById('reason').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            try {
                const res = await fetch('/api/visitors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, reason })
                });

                if (res.ok) {
                    document.getElementById('purposeStep').classList.add('hidden');
                    document.getElementById('successStep').classList.remove('hidden');
                } else {
                    alert("Error saving log.");
                    submitBtn.disabled = false;
                }
            } catch (err) {
                alert("Connection error.");
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
