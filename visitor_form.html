<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEU Library Check-in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container" id="formSection">
        <img src="New_Era_University.svg.png" alt="NEU Logo" style="width: 100px; display: block; margin: 0 auto 20px auto;">
        
        <h1>Library Check-in</h1>
        
        <form id="visitForm">
            <label>Purpose of Visit:</label>
            <select id="reason" required>
                <option value="Reading">Reading</option>
                <option value="Research">Research</option>
                <option value="Computer">Computer Use</option>
                <option value="Borrowing/Returning">Borrowing/Returning Books</option>
            </select>

            <label>College:</label>
            <select id="college" required>
                <option value="CICS">CICS</option>
                <option value="CBA">CBA</option>
                <option value="CAS">CAS</option>
                <option value="CED">CED</option>
                <option value="COE">COE</option>
            </select>

            <button type="submit" style="background-color: #cc0000; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px;">Submit Visit</button>
        </form>
    </div>

    <div class="form-container" id="welcomeMessage" style="display: none;">
        <h1 style="color: #d90429;">Welcome to NEU Library!</h1>
        <p style="font-size: 1.1rem; margin: 20px 0;">Your visit has been successfully recorded in the digital log.</p>
        <button onclick="window.location.reload()" style="background-color: #333; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">New Check-in</button>
    </div>

    <script>
        document.getElementById('visitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const visitData = {
                reason: document.getElementById('reason').value,
                college: document.getElementById('college').value,
                // We send 'false' since it's only for students now
                isEmployee: false,
                time: new Date().toLocaleString()
            };
            
            fetch('/api/visitors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(visitData)
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('formSection').style.display = 'none';
                    document.getElementById('welcomeMessage').style.display = 'block';
                }
            })
            .catch(error => console.error("Error:", error));
        });
    </script>
</body>
</html>
