<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Your Visit - NEU Library</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
            background-size: cover; 
            background-position: center; 
            height: 100vh; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }

        /* Container for the logout button and the form */
        #pageContent {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #cc0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .form-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        select { 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #ddd; 
            font-size: 16px; 
            margin-bottom: 20px; 
            background-color: #f9f9f9;
        }

        .log-btn { 
            width: 100%; 
            background-color: #cc0000; 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px;
        }

        /* Success Screen Full Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000; /* Ensures it covers the logout button */
        }

        .success-text {
            color: #cc0000;
            font-size: clamp(30px, 8vw, 60px);
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .done-btn {
            padding: 12px 30px;
            background: #004a99;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="pageContent">
        <button class="logout-btn" onclick="location.href='index.html'">Logout</button>
        
        <div class="form-card">
            <h2 style="color: #333; margin-bottom: 20px;">What is your purpose?</h2>
            <select id="reason">
                <option value="Study">Study / Research</option>
                <option value="Borrow">Borrow / Return Books</option>
                <option value="Clearance">Clearance / Documents</option>
                <option value="Meeting">Group Meeting</option>
            </select>
            <button class="log-btn" onclick="submitVisit()">Log My Visit</button>
        </div>
    </div>

    <script>
        async function submitVisit() {
            const email = localStorage.getItem("userEmail");
            const reason = document.getElementById('reason').value;

            if (!email) {
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch('/api/visitors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, reason })
                });

                if (res.ok) {
                    // This creates a fresh overlay that covers the entire screen, including the logout button
                    const overlay = document.createElement('div');
                    overlay.className = 'success-overlay';
                    overlay.innerHTML = `
                        <h1 class="success-text">Welcome to NEU Library!</h1>
                        <button class="done-btn" onclick="window.location.href='index.html'">Done</button>
                    `;
                    document.body.appendChild(overlay);
                } else {
                    alert("Error saving log.");
                }
            } catch (err) {
                alert("Connection error.");
            }
        }
    </script>
</body>
</html>
