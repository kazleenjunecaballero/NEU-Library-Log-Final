<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Your Visit - NEU Library</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
            background-size: cover; 
            background-position: center; 
            height: 100vh; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #cc0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 2000;
        }

        .form-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        /* Style for the Logo */
        .neu-logo {
            width: 100px;
            margin-bottom: 20px;
        }

        h2 { color: #333; margin-bottom: 20px; }

        select { 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #ddd; 
            font-size: 16px; 
            margin-bottom: 20px; 
            background-color: #f9f9f9;
        }

        .log-btn { 
            width: 100%; 
            background-color: #cc0000; 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px;
        }

        .success-message h1 {
            color: #cc0000;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <button class="logout-btn" onclick="handleLogout()">Logout</button>
    
    <div class="form-card" id="mainCard">
        <div id="purposeStep">
            <h2>What is your purpose?</h2>
            <select id="reason">
                <option value="Study">Study / Research</option>
                <option value="Borrow">Borrow / Return Books</option>
                <option value="Clearance">Clearance / Documents</option>
                <option value="Meeting">Group Meeting</option>
            </select>
            <button class="log-btn" onclick="submitVisit()">Log My Visit</button>
        </div>

        <div id="successStep" class="hidden">
            <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo">
            <div class="success-message">
                <h1>Welcome to NEU Library!</h1>
            </div>
        </div>
    </div>

    <script>
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function submitVisit() {
            const email = localStorage.getItem("userEmail");
            const reason = document.getElementById('reason').value;

            if (!email) {
                window.location.href = "index.html";
                return;
            }

            try {
                // Ensure this matches your server's POST route
                const res = await fetch('/api/visitors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, reason })
                });

                if (res.ok) {
                    document.getElementById('purposeStep').classList.add('hidden');
                    document.getElementById('successStep').classList.remove('hidden');
                    
                    // Auto-logout after 5 seconds to clear the screen for the next user
                    setTimeout(() => {
                        handleLogout();
                    }, 5000);

                } else {
                    alert("Error saving log.");
                }
            } catch (err) {
                alert("Connection error.");
            }
        }
    </script>
</body>
</html>
