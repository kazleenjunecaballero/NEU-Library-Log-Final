<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEU Library Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="login-card">
        <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo" style="width: 100px; display: block; margin: 0 auto 20px auto;">
        
        <h1>Library Visitor Log</h1>
        <p>Please sign in with your NEU email</p>
        
        <div class="input-group">
            <input type="email" id="userEmail" placeholder="Enter your NEU email">
        </div>

        <div id="g_id_onload"
             data-client_id="190984431112-d575e8s1q36upjf1lsfupok2161q1bnm.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <script>
        // Enter key listener
        document.getElementById("userEmail").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                alert("Please click the 'Sign in with Google' button to verify your identity.");
            }
        });

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            const userEmail = responsePayload.email;
            console.log("Logged in as: " + userEmail);
            
            // 1. Check for Admin (Your email)
            if (userEmail === 'kazleenjunecaballero@gmail.com') {
                alert("Welcome, Professor! Redirecting to Admin Dashboard...");
                window.location.href = "admin.html";
            } 
            // 2. Check if it's a valid NEU Student email
            else if (userEmail.endsWith('@neu.edu.ph')) {
                alert("Login Successful! Redirecting to Check-in...");
                window.location.href = "visitor_form.html";
            } 
            // 3. Block all other personal emails
            else {
                alert("Access Denied! Please use your official @neu.edu.ph email account.");
                google.accounts.id.disableAutoSelect(); // Resets the prompt
            }
        }

        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
