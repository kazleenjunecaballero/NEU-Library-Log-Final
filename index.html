<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEU Library Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            /* Make sure background.jpg is in your folder for this to show */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); 
            background-size: cover; 
            background-position: center;
            height: 100vh; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px;
            width: 350px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input {
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd;
            border-radius: 8px; 
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%; 
            padding: 12px; 
            background: #cc0000; 
            color: white;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
        }
        .login-btn:hover { background: #990000; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="New_Era_University.svg.png" alt="NEU Logo" style="width: 80px; margin-bottom: 10px;">
        <h2 style="color: #333; margin-bottom: 5px;">Library Visitor Log</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Sign in with your institutional email</p>
        
        <input type="email" id="userEmail" placeholder="Email (e.g. alaurice@neu.edu.ph)" required>
        <button class="login-btn" onclick="handleLogin()">Login</button>
    </div>

    <script>
    async function handleLogin() {
        const emailInput = document.getElementById('userEmail');
        const email = emailInput.value.trim();

        if (!email) {
            alert("Please enter your email.");
            return;
        }

        try {
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (res.ok) {
                // Save email so registration and visitor forms can use it
                localStorage.setItem("userEmail", email.toLowerCase());
                
                // Redirect based on what the server decided (admin, register, or log visit)
                window.location.href = data.redirect; 
            } else {
                // This will now show "Access Denied. Use format: firstname.lastname@neu.edu.ph"
                alert(data.message || "Invalid Email");
            }
        } catch (err) {
            console.error("Login Error:", err);
            alert("Server connection failed. Make sure your server is running!");
        }
    }
</script>
