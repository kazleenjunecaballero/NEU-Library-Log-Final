<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEU Library Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="login-card">
        <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo" style="width: 100px; display: block; margin: 0 auto 20px auto;">
        
        <h1>Library Visitor Log</h1>
        <p>Please sign in with your NEU email</p>
        
        <div class="input-group">
            <input type="email" id="userEmail" placeholder="Enter your NEU email">
        </div>

        <div id="g_id_onload"
             data-client_id="190984431112-d575e8s1q36upjf1lsfupok2161q1bnm.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <script>
        // Prototype Magic: Hit Enter to log in instantly without a password
        document.getElementById("userEmail").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                const typedEmail = document.getElementById("userEmail").value.trim().toLowerCase();
                
                // Use the same logic for the typed email
                processLogin(typedEmail);
            }
        });

        // This handles the REAL Google Login button
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            processLogin(responsePayload.email);
        }

        // ONE central place for login logic to avoid mistakes
        function processLogin(email) {
            if (!email) {
                alert("Please enter an email address.");
                return;
            }

            // 1. Admin/Professor Check
            if (email === 'jcesperanza@neu.edu.ph') {
                alert("Welcome, Professor! Redirecting to Admin Dashboard...");
                window.location.href = "admin.html";
            } 
            // 2. Student NEU Check
            else if (email.endsWith('@neu.edu.ph')) {
                alert("NEU Account Verified. Redirecting to Check-in...");
                window.location.href = "visitor_form.html";
            } 
            // 3. Rejection logic (The "404" style error)
            else {
                alert("ACCESS DENIED!\n\n'" + email + "' is not a valid NEU account. Only @neu.edu.ph emails can access the Library Log.");
                if(window.google) google.accounts.id.disableAutoSelect();
            }
        }

        // Keep this! It's the important code that reads the Google Data
        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
