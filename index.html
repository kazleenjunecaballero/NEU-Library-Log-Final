<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEU Library Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <img src="New_Era_University.svg.png" alt="NEU Logo" style="width: 100px; display: block; margin: 0 auto 20px auto;">
        <h1>Library Visitor Log</h1>
        <div class="input-group">
            <input type="email" id="userEmail" placeholder="Enter your NEU email">
        </div>
        <button onclick="processLogin(document.getElementById('userEmail').value.trim().toLowerCase())" style="width:100%; padding:10px; background:#cc0000; color:white; border:none; border-radius:5px; cursor:pointer;">Login</button>
    </div>

    <script>
        async function processLogin(email) {
            if (!email) return alert("Email required");
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem("userEmail", email);
                    if (data.role === 'admin') {
                        if (confirm("Welcome Prof! OK for Dashboard, Cancel for Normal Visit.")) {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = data.isNew ? 'registration.html' : 'visitor_form.html';
                        }
                    } else {
                        window.location.href = data.redirect;
                    }
                } else { alert(data.message); }
            } catch (err) { alert("Server Error"); }
        }
    </script>
</body>
</html>
