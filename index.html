<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEU Library Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="login-card">
        <img src="New_Era_University.svg.png" alt="NEU Logo" style="width: 100px; display: block; margin: 0 auto 20px auto;">
        <h1>Library Visitor Log</h1>
        <div class="input-group">
            <input type="email" id="userEmail" placeholder="Enter your NEU email">
        </div>
        <div id="g_id_onload" data-client_id="190984431112-d575e8s1q36upjf1lsfupok2161q1bnm.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <script>
        document.getElementById("userEmail").addEventListener("keypress", (e) => {
            if (e.key === "Enter") processLogin(e.target.value.trim().toLowerCase());
        });

        function handleCredentialResponse(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            processLogin(payload.email);
        }

        async function processLogin(email) {
            if (!email) return alert("Email required");
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem("userEmail", email.toLowerCase());
                    
                    if (data.role === 'admin') {
                        // Admin Choice Modal
                        if (confirm("Welcome Prof! Click OK to open Admin Dashboard, or Cancel to log a normal visit.")) {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = data.isNew ? 'registration.html' : 'visitor_form.html';
                        }
                    } else {
                        window.location.href = data.redirect;
                    }
                } else {
                    alert(data.message);
                }
            } catch (err) { alert("Server Error"); }
        }
    </script>
</body>
</html>
