<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEU Library Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="login-card">
        <img src="New_Era_University.svg.png" alt="NEU Logo" class="neu-logo" style="width: 100px; display: block; margin: 0 auto 20px auto;">
        <h1>Library Visitor Log</h1>
        <p>Please sign in with your NEU email</p>
        <div class="input-group">
            <input type="email" id="userEmail" placeholder="Enter your NEU email">
        </div>
        <div id="g_id_onload"
             data-client_id="190984431112-d575e8s1q36upjf1lsfupok2161q1bnm.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <script>
        document.getElementById("userEmail").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                const typedEmail = document.getElementById("userEmail").value.trim().toLowerCase();
                processLogin(typedEmail);
            }
        });

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            processLogin(responsePayload.email);
        }

        // UPDATED: Now talks to your server to check registration status
        async function processLogin(email) {
            if (!email) {
                alert("Please enter an email address.");
                return;
            }

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save email for the next pages to use
                    localStorage.setItem("userEmail", email.toLowerCase());
                    
                    // The server tells us where to go: admin.html, registration.html, or visitor_form.html
                    window.location.href = data.redirect;
                } else {
                    alert(data.message || "Access Denied");
                    document.getElementById("userEmail").value = "";
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("Connection error. Is the server running?");
            }
        }

        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
