<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role - NEU Library</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .selection-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 { color: #333; margin-bottom: 30px; }

        .choice-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
        }

        .choice-btn:hover { transform: scale(1.02); }

        .admin-btn { background-color: #333; color: white; }
        .user-btn { background-color: #cc0000; color: white; }
    </style>
</head>
<body>

    <div class="selection-card">
        <h2>Welcome, Admin!</h2>
        <p style="color: #666; margin-bottom: 20px;">What would you like to do today?</p>
        
        <button class="choice-btn admin-btn" onclick="goToAdmin()">Go to Admin Dashboard</button>
        <button class="choice-btn user-btn" onclick="goToUser()">Normal Log In</button>
    </div>

    <script>
        // Use the saved email to check if admin is already registered as a visitor
        async function goToUser() {
            const email = localStorage.getItem("userEmail");
            
            try {
                // We check the server to see if the admin has a visitor profile yet
                const res = await fetch(`/api/visitors/check?email=${email}`);
                const data = await res.json();

                if (data.exists) {
                    window.location.href = 'visitor_form.html';
                } else {
                    window.location.href = 'registration.html';
                }
            } catch (err) {
                // If the check fails, default to registration
                window.location.href = 'registration.html';
            }
        }

        function goToAdmin() {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
