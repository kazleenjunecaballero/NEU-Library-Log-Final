<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - NEU Library</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reg-card { background: white; padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #004a99; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h2>Register Profile</h2>
        <form id="regForm">
            <div class="form-group"><label>First Name</label><input type="text" id="fn" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="ln" required></div>
            <div class="form-group">
                <label>I am a:</label>
                <select id="role" required>
                    <option value="Student">Student</option>
                    <option value="Faculty">Faculty</option>
                </select>
            </div>
            <div class="form-group">
                <label>College</label>
                <select id="col" required>
                    <option value="CICS">CICS</option>
                    <option value="CEA">CEA</option>
                    <option value="CBA">CBA</option>
                </select>
            </div>
            <div class="form-group"><label>Course/Program</label><input type="text" id="prog" placeholder="e.g. BSCS" required></div>
            <button type="submit">Complete Registration</button>
        </form>
    </div>
    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = localStorage.getItem("userEmail");
            const data = {
                firstName: document.getElementById('fn').value,
                lastName: document.getElementById('ln').value,
                email: email,
                role: document.getElementById('role').value,
                college: document.getElementById('col').value,
                program: document.getElementById('prog').value,
                reason: "Account Created"
            };
            const res = await fetch('/api/visitors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                // Centered Welcome Screen
                document.body.innerHTML = `<div style="height:100vh; display:flex; justify-content:center; align-items:center; background:white;"><h1 style="color:#cc0000; font-size:48px;">Welcome to NEU Library!</h1></div>`;
                setTimeout(() => { window.location.href = "index.html"; }, 3000);
            }
        };
    </script>
</body>
</html>
