<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile - NEU Library</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .reg-card { background: white; padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .hidden { display: none; }
        .submit-btn { width: 100%; padding: 12px; background: #004a99; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #003366; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h2 style="color: #cc0000; text-align: center;">Register Profile</h2>
        <form id="regForm">
            <div class="form-group"><label>First Name</label><input type="text" id="fn" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="ln" required></div>
            
            <div class="form-group">
                <label>I am a:</label>
                <select id="userRole" onchange="toggleFields()">
                    <option value="Student">Student</option>
                    <option value="Faculty">Faculty</option>
                </select>
            </div>

            <div id="studentFields">
                <div class="form-group">
                    <label>College</label>
                    <select id="college" onchange="updatePrograms()">
                        <option value="">-- Select --</option>
                        <option value="CICS">CICS</option>
                        <option value="CEA">CEA</option>
                        <option value="CBA">CBA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Program</label>
                    <select id="program"><option value="">Select College First</option></select>
                </div>
                <div class="form-group">
                    <label>Year Level</label>
                    <select id="yearLevel">
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
            </div>

            <div id="facultyFields" class="hidden">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="dept" placeholder="e.g. CICS">
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="pos" placeholder="e.g. Instructor">
                </div>
            </div>

            <button type="submit" class="submit-btn">Finish Registration</button>
        </form>
    </div>

    <script>
        const programData = { 
            "CICS": ["BSCS", "BSIT", "BSIS"], 
            "CEA": ["BSCE", "BSEE"], 
            "CBA": ["BSA", "BSBA"] 
        };

        function updatePrograms() {
            const college = document.getElementById('college').value;
            const programSelect = document.getElementById('program');
            programSelect.innerHTML = '';
            if (programData[college]) {
                programData[college].forEach(p => {
                    let opt = new Option(p, p);
                    programSelect.add(opt);
                });
            } else {
                programSelect.add(new Option("Select College First", ""));
            }
        }

        function toggleFields() {
            const isStudent = document.getElementById('userRole').value === 'Student';
            document.getElementById('studentFields').classList.toggle('hidden', !isStudent);
            document.getElementById('facultyFields').classList.toggle('hidden', isStudent);
            
            // Clear inputs when toggling to avoid sending student data for a faculty role
            if (isStudent) {
                document.getElementById('dept').value = '';
                document.getElementById('pos').value = '';
            } else {
                document.getElementById('college').value = '';
                document.getElementById('program').innerHTML = '<option value="">Select College First</option>';
            }
        }

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const role = document.getElementById('userRole').value;
            const email = localStorage.getItem("userEmail");

            if (!email) {
                alert("Session expired. Please login again.");
                window.location.href = "index.html";
                return;
            }

            const data = {
                firstName: document.getElementById('fn').value,
                lastName: document.getElementById('ln').value,
                email: email,
                role: role,
                // These will be null if the role doesn't match
                college: role === 'Student' ? document.getElementById('college').value : null,
                program: role === 'Student' ? document.getElementById('program').value : null,
                yearLevel: role === 'Student' ? document.getElementById('yearLevel').value : null,
                department: role === 'Faculty' ? document.getElementById('dept').value : null,
                position: role === 'Faculty' ? document.getElementById('pos').value : null,
                reason: "Account Created"
            };

            try {
                const res = await fetch('/api/visitors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert("Profile Registered Successfully!");
                    window.location.href = "visitor_form.html"; 
                } else {
                    const errData = await res.json();
                    alert("Error: " + (errData.error || "Failed to save profile."));
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        };
    </script>
</body>
</html>
