<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile - NEU Library</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reg-card { background: white; padding: 30px; border-radius: 15px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .hidden { display: none; }
        .submit-btn { width: 100%; padding: 15px; background: #004a99; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h2 style="color: #cc0000;">Register Profile</h2>
        <form id="regForm">
            <div class="form-group"><label>First Name</label><input type="text" id="fn" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="ln" required></div>
            
            <div class="form-group">
                <label>I am a:</label>
                <select id="userRole" onchange="toggleFields()" required>
                    <option value="Student">Student</option>
                    <option value="Faculty">Faculty</option>
                </select>
            </div>

            <div id="studentFields">
                <div class="form-group">
                    <label>College</label>
                    <select id="college">
                        <option value="CICS">CICS</option>
                        <option value="CEA">CEA</option>
                        <option value="CBA">CBA</option>
                        <option value="CAS">CAS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Course / Program</label>
                    <select id="year level">
                        <option value="1st Year">BSCS</option>
                        <option value="2nd Year">BSIT</option>
                        <option value="3rd Year">BSCE</option>
                        <option value="4th Year">BSA</option>
                    </select>
                </div>
            </div>

            <div id="facultyFields" class="hidden">
                <div class="form-group">
                    <label>Department</label>
                    <select id="department">
                        <option value="CICS">Information Technology</option>
                        <option value="CEA">Computer Science</option>
                        <option value="CBA">General Education</option>
                        <option value="CAS">Engineering</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <select id="position">
                        <option value="Instructor">Instructor</option>
                        <option value="Assistant Professor">Assistant Professor</option>
                        <option value="Associate Professor">Associate Professor</option>
                        <option value="Professor">Professor</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="submit-btn">Complete Registration</button>
        </form>
    </div>

    <script>
        function toggleFields() {
            const role = document.getElementById('userRole').value;
            const sFields = document.getElementById('studentFields');
            const fFields = document.getElementById('facultyFields');
            
            if (role === 'Faculty') {
                sFields.classList.add('hidden');
                fFields.classList.remove('hidden');
            } else {
                sFields.classList.remove('hidden');
                fFields.classList.add('hidden');
            }
        }

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const role = document.getElementById('userRole').value;
            const data = {
                firstName: document.getElementById('fn').value,
                lastName: document.getElementById('ln').value,
                email: localStorage.getItem("userEmail"),
                role: role,
                college: role === 'Student' ? document.getElementById('college').value : null,
                program: role === 'Student' ? document.getElementById('program').value : null,
                department: role === 'Faculty' ? document.getElementById('department').value : null,
                position: role === 'Faculty' ? document.getElementById('position').value : null,
                reason: "Account Created"
            };

            const res = await fetch('/api/visitors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.body.innerHTML = `<div style="height:100vh; display:flex; justify-content:center; align-items:center; background:white;"><h1 style="color:#cc0000; font-size:48px;">Welcome to NEU Library!</h1></div>`;
                setTimeout(() => { window.location.href = "index.html"; }, 3000);
            }
        };
    </script>
</body>
</html>
