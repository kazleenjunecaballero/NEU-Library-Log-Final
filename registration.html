<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile - NEU Library</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        .reg-card { 
            background: rgba(255, 255, 255, 0.95); padding: 30px; 
            border-radius: 20px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: #333; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: #fff; }
        .hidden { display: none; }
        .submit-btn { 
            width: 100%; padding: 14px; background: #cc0000; color: white; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;
        }
        .submit-btn:hover { background: #990000; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h2 style="color: #cc0000; text-align: center; margin-top: 0;">Register Profile</h2>
        <form id="regForm">
            <div class="form-group"><label>First Name</label><input type="text" id="fn" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="ln" required></div>
            <div class="form-group">
                <label>I am a:</label>
                <select id="userRole" onchange="toggleFields()">
                    <option value="Student">Student</option>
                    <option value="Faculty">Faculty</option>
                </select>
            </div>
            <div id="studentFields">
                <div class="form-group">
                    <label>College</label>
                    <select id="college" onchange="updatePrograms()">
                        <option value="">-- Select --</option>
                        <option value="CICS">CICS</option>
                        <option value="CEA">CEA</option>
                        <option value="CBA">CBA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Program</label>
                    <select id="program"><option value="">Select College First</option></select>
                </div>
                <div class="form-group">
                    <label>Year Level</label>
                    <select id="yearLevel">
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
            </div>
            <div id="facultyFields" class="hidden">
                <div class="form-group">
                    <label>Department</label>
                    <select id="dept">
                        <option value="">-- Select Department --</option>
                        <option value="CICS">CICS</option>
                        <option value="CBA">CBA</option>
                        <option value="CEA">CEA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <select id="pos">
                        <option value="">-- Select Position --</option>
                        <option value="Instructor">Instructor</option>
                        <option value="Professor">Professor</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="submit-btn">Finish Registration</button>
        </form>
    </div>

    <script>
        const programData = { "CICS": ["BSCS", "BSIT", "BSIS"], "CEA": ["BSCE", "BSEE"], "CBA": ["BSA", "BSBA"] };
        function updatePrograms() {
            const college = document.getElementById('college').value;
            const programSelect = document.getElementById('program');
            programSelect.innerHTML = '';
            if (programData[college]) {
                programData[college].forEach(p => programSelect.add(new Option(p, p)));
            } else {
                programSelect.add(new Option("Select College First", ""));
            }
        }
        function toggleFields() {
            const isStudent = document.getElementById('userRole').value === 'Student';
            document.getElementById('studentFields').classList.toggle('hidden', !isStudent);
            document.getElementById('facultyFields').classList.toggle('hidden', isStudent);
        }
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const role = document.getElementById('userRole').value;
            const firstName = document.getElementById('fn').value;
            const program = role === 'Student' ? document.getElementById('program').value : document.getElementById('dept').value;

            const data = {
                firstName: firstName,
                lastName: document.getElementById('ln').value,
                email: localStorage.getItem("userEmail"),
                role: role,
                college: role === 'Student' ? document.getElementById('college').value : null,
                program: program,
                yearLevel: role === 'Student' ? document.getElementById('yearLevel').value : null,
                department: role === 'Faculty' ? document.getElementById('dept').value : null,
                position: role === 'Faculty' ? document.getElementById('pos').value : null,
                reason: "Account Created"
            };

            const res = await fetch('/api/visitors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                localStorage.setItem("userName", firstName);
                localStorage.setItem("userProgram", program);
                alert("Profile Registered!");
                window.location.href = "visitor_form.html";
            }
        };
    </script>
</body>
</html>
