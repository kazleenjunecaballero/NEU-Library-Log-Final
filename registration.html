<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile - NEU Library</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
            background-size: cover; background-position: center; height: 100vh; margin: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .reg-card { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; }
        .form-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; text-align: left; }
        .full-width { grid-column: span 2; }
        label { font-size: 12px; color: #888; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { width: 100%; background-color: #004a99; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h1>First Time?</h1>
        <p>Set up your profile to start logging visits.</p>
        <form id="profileForm">
            <div class="form-group">
                <div><label>First Name</label><input type="text" id="firstName" required></div>
                <div><label>Last Name</label><input type="text" id="lastName" required></div>
            </div>
            <div class="form-group">
                <div class="full-width">
                    <label>Email</label>
                    <input type="email" id="displayEmail" readonly style="background: #f4f4f4;">
                </div>
            </div>
            <div class="form-group">
                <div class="full-width">
                    <label>College</label>
                    <select id="college" required>
                        <option value="CICS">CICS</option>
                        <option value="CEA">CEA</option>
                        <option value="CBA">CBA</option>
                        <option value="CAS">CAS</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="submit-btn">Save Profile & Continue</button>
        </form>
    </div>

    <script>
        const savedEmail = localStorage.getItem("userEmail");
        if (savedEmail) document.getElementById('displayEmail').value = savedEmail;

        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            const profileData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: savedEmail,
                college: document.getElementById('college').value,
                reason: "Account Created" 
            };

            const response = await fetch('/api/visitors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(profileData)
            });

            if (response.ok) {
                alert("Profile Saved!");
                window.location.href = "visitor_form.html";
            }
        };
    </script>
</body>
</html>
